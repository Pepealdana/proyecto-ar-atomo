<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Átomo en Realidad Aumentada</title>
  
  <!-- Librerías desde CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Indicador UI -->
  <div id="ui-container">Apunta la cámara a la carta del Átomo</div>

  <!-- Escena 3D + RA -->
  <a-scene 
    mindar-image="
      imageTargetSrc: ./targets.mind; 
      filterMinCF: 0.0001; 
      filterBeta: 0.001; 
      missTolerance: 5; 
      warmupTolerance: 5;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Enlace al modelo 3D del núcleo o recurso externo libre (GLB/glTF) -->
      <a-asset-item id="nucleoModel" src="./modelos/nucleo.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objeto anclado a la carta (Target Index 0) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Núcleo 3D (Cargado o creado geométricamente) -->
      <a-gltf-model src="#nucleoModel" position="0 0 0" scale="0.3 0.3 0.3"></a-gltf-model>

      <!-- Órbita visual -->
      <a-ring color="#4CC3D9" radius-inner="1.19" radius-outer="1.21" rotation="90 0 0"></a-ring>

      <!-- Animación orbital del electrón vía JavaScript/A-Frame -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
        <a-sphere position="1.2 0 0" radius="0.08" color="#FFC65D"></a-sphere>
      </a-entity>

      <!-- Etiqueta 3D del elemento -->
      <a-text value="Atomo de Hidrogeno" position="-0.8 1.5 0" scale="0.6 0.6 0.6" color="#FFFFFF" align="center"></a-text>

    </a-entity>
  </a-scene>

</body>
</html>
