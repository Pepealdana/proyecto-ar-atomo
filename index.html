<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - Visor de Realidad Aumentada</title>
  
  <!-- Librerías RA desde CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Capa de Interfaz de Usuario (UI Overlay) -->
  <div id="ui-overlay">
    
    <!-- Header Superior -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">⚛️</span>
        <div>
          <h1>AURA</h1>
          <p>Augmented Reality Learning</p>
        </div>
      </div>
      <span id="scan-status" class="status-badge pulse">Escaneando...</span>
    </header>

    <!-- Indicador Flotante -->
    <div id="scanner-hint">
      🔍 Apunta la cámara a una ficha didáctica
    </div>

    <!-- Tarjeta Informativa e Interactiva -->
    <div id="info-card" class="card hidden">
      <div class="card-header">
        <h2 id="card-title">Cargando...</h2>
        <span id="card-tag" class="tag">Ciencia</span>
      </div>
      <p id="card-description">Apunta a un marcador para ver la información.</p>
      
      <!-- Controles interactivos -->
      <div class="card-actions">
        <button id="btn-toggle-anim" class="btn primary">⏸️ Pausar Animación</button>
        <button id="btn-audio" class="btn secondary">🔊 Explicación</button>
      </div>
    </div>

  </div>

  <!-- Escena 3D + RA -->
  <a-scene 
    mindar-image="
      imageTargetSrc: ./assets/targets/targets.mind; 
      filterMinCF: 0.001; 
      filterBeta: 0.01; 
      missTolerance: 5; 
      warmupTolerance: 5;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="nucleoModel" src="./assets/models/nucleo.glb"></a-asset-item>
      <a-asset-item id="corazonModel" src="./assets/models/corazon.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET 0: Átomo de Hidrógeno -->
    <a-entity id="target-hidrogeno" mindar-image-target="targetIndex: 0">
      <a-entity position="0 0 0" scale="0.3 0.3 0.3">
        <a-light type="directional" intensity="1.5" position="1 2 1"></a-light>
        <a-light type="ambient" intensity="0.5"></a-light>

        <a-gltf-model src="#nucleoModel" position="0 0 0"></a-gltf-model>
        <a-ring color="#00f2fe" radius-inner="1.19" radius-outer="1.21" rotation="90 0 0"></a-ring>

        <a-entity id="orbit-anim" animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
          <a-sphere position="1.2 0 0" radius="0.1" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.5"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- TARGET 1: Corazón / Biología -->
    <a-entity id="target-corazon" mindar-image-target="targetIndex: 1">
      <a-entity position="0 0 0" scale="0.015 0.015 0.015" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-light type="directional" intensity="1.8" position="0 2 1"></a-light>
        <a-light type="ambient" intensity="0.6"></a-light>
        <a-gltf-model src="#corazonModel" position="0 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- Lógica principal de la aplicación -->
  <script src="js/app.js"></script>
</body>
</html>
